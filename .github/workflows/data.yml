name: Refresh data.json
on:
  schedule:
    - cron: "17 1 * * *"   # daily ~01:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data.json (Coin Metrics history + bitcoin-data fresh metrics)
        run: python3 build_data.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: refresh data.json [skip ci]"
            git push
          else
            echo "data.json unchanged"
          fi
