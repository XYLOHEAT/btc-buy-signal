name: Refresh data.json
on:
  schedule:
    - cron: "17 1 * * *"   # daily ~01:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # keepalive step re-enables scheduled workflows
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build data.json (Coin Metrics history + bitcoin-data fresh metrics)
        run: python3 build_data.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: refresh data.json [skip ci]"
            git push
          else
            echo "data.json unchanged"
          fi
      - name: Keepalive (GitHub disables cron after 60 days without user commits)
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/codeql.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
