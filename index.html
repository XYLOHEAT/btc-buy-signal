<!DOCTYPE html>
<html lang="th">
<head>

<!-- defer: not render-blocking; drawChart() waits for this tag's load event -->
<script id="chartjs" defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
/* Self-hosted font (SIL OFL 1.1, fonts/OFL-Anuphan.txt): the variable woff2 subsets Google Fonts serves.
   One family carries the whole UI (ADR-013): Thai + Latin, weights 400-700, and its digits are tabular by design.
   unicode-range = a browser only downloads the subsets the page uses (thai only in Thai mode). */
@font-face{font-family:'Anuphan';font-weight:400 700;font-display:swap;src:url(fonts/anuphan-thai.woff2) format('woff2');unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Anuphan';font-weight:400 700;font-display:swap;src:url(fonts/anuphan-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Anuphan';font-weight:400 700;font-display:swap;src:url(fonts/anuphan-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  /* text colors stay >= 4.5:1 on --bg and --surface (WCAG AA); --faint is the floor */
  --bg:#f3f3f0; --surface:#fafaf8; --ink:#171715; --muted:#5f5f5a; --faint:#6e6e69;
  --line:rgba(20,20,16,.14); --line-soft:rgba(20,20,16,.07);
  --btc:#c96b08;
  --z-good:#1c7a47; --z-ok:#5a7711; --z-neutral:#926500; --z-warn:#ae5318; --z-bad:#bb2f24;
  --font:'Anuphan',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* type scale: fixed rem steps (product UI). 13px is the floor: Thai vowel and tone marks need it */
  --text-caption:.8125rem;  /* 13: notes, meta, table heads, badges */
  --text-ui:.875rem;        /* 14: controls, statuses, table cells, labels */
  --text-body:1rem;         /* 16: sentences, names, values */
  --text-subhead:1.25rem;   /* 20: section headings, masthead, card values */
  --text-title:1.5rem;      /* 24: verdict, index values */
  --text-display:3.75rem;   /* 60: the score */
  /* spacing: 4pt scale in rem, so it grows with the user's font size. Nothing off-scale */
  --space-xs:.25rem; --space-sm:.5rem; --space-md:.75rem; --space-lg:1rem;
  --space-xl:1.5rem; --space-2xl:2rem; --space-3xl:3rem; --space-4xl:4rem;
}
/* dark zone ramp: OKLCH L .71-.80, C .10-.11 (calm; was stock Tailwind 400s at C .15-.19) */
.dk{ --bg:#0e0f12; --surface:#16181c; --ink:#e9e7e1; --muted:#9b988f; --faint:#85827b;
  --line:rgba(255,255,255,.13); --line-soft:rgba(255,255,255,.06); --btc:#f7931a;
  --z-good:#75c59b; --z-ok:#abca84; --z-neutral:#dbb970; --z-warn:#dc9a6c; --z-bad:#de857e; }
@media (prefers-color-scheme: dark){ :root:not(.lt){
  --bg:#0e0f12; --surface:#16181c; --ink:#e9e7e1; --muted:#9b988f; --faint:#85827b;
  --line:rgba(255,255,255,.13); --line-soft:rgba(255,255,255,.06); --btc:#f7931a;
  --z-good:#75c59b; --z-ok:#abca84; --z-neutral:#dbb970; --z-warn:#dc9a6c; --z-bad:#de857e; }}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--text-body);line-height:1.6;font-kerning:normal;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font:inherit;color:inherit}
h1,h2,dl,dd{margin:0}
h1,h2{text-wrap:balance}
:focus-visible{outline:2.5px solid var(--btc);outline-offset:2px;border-radius:3px}
.wrap{max-width:460px;margin:0 auto;padding:max(env(safe-area-inset-top),var(--space-lg)) var(--space-lg) calc(env(safe-area-inset-bottom) + var(--space-3xl))}

.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-md);padding-bottom:var(--space-md);border-bottom:1.5px solid var(--ink)}
.mast h1{font-size:var(--text-subhead);font-weight:700;line-height:1.25}
.mast .sub{font-size:var(--text-caption);color:var(--muted);line-height:1.4;margin-top:var(--space-xs)}
.ctrls{display:flex;gap:var(--space-sm);flex:0 0 auto}
/* quieter than the content: a hairline, not an ink frame */
.cbtn{font-size:var(--text-ui);font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);
  padding:0 var(--space-sm);min-height:44px;min-width:44px;cursor:pointer;display:grid;place-items:center;transition:border-color .18s}
.cbtn:hover,.cbtn:active{border-color:var(--ink)} .cbtn.busy{opacity:.4}
.cbtn svg{width:17px;height:17px;display:block}

.verdict{padding:var(--space-lg) 0;border-bottom:1px solid var(--line);text-align:center}
.gauge{position:relative;width:196px;height:196px;margin:0 auto}
.gauge svg{transform:rotate(-90deg);display:block}
.gauge .track{fill:none;stroke:var(--line-soft);stroke-width:7}
.gauge .arc{fill:none;stroke-width:7;stroke-linecap:butt;transition:stroke-dashoffset .6s cubic-bezier(.25,1,.5,1)}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score{font-weight:700;font-size:var(--text-display);line-height:1;letter-spacing:-.02em}
.score .max{font-size:var(--text-ui);font-weight:600;color:var(--faint);letter-spacing:0}
.zone{font-weight:700;font-size:var(--text-title);line-height:1.25;margin-top:var(--space-md)}
.zone-th{color:var(--muted);margin-top:var(--space-xs)}
.tape{font-weight:600;margin-top:var(--space-md);display:flex;align-items:center;justify-content:center;gap:var(--space-md);flex-wrap:wrap}
.tape .dot{width:7px;height:7px;border-radius:50%;background:var(--z-good);display:inline-block;margin-right:var(--space-xs)}
.tape .chg.up{color:var(--z-good)} .tape .chg.down{color:var(--z-bad)}
.asof{font-size:var(--text-caption);color:var(--faint);margin-top:var(--space-sm);line-height:1.55}
.asof .stale{color:var(--z-warn);font-weight:600}

/* the plan: tight inside, one step of air before the facts */
.plan{margin-top:var(--space-lg);display:grid;gap:var(--space-md)}
.plan dt{font-size:var(--text-caption);font-weight:600;color:var(--muted)}
.plan dd{margin-top:var(--space-xs);line-height:1.55;max-width:65ch;text-wrap:pretty}
.plan div:first-child dd{font-weight:600}  /* what to do: the one line to act on */
.disc{margin:var(--space-md) 0 0;font-size:var(--text-caption);color:var(--muted)}
.facts{margin-top:var(--space-xl);border-top:1px solid var(--line)}
.facts div{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-md);padding:var(--space-sm) 0;border-bottom:1px solid var(--line-soft)}
.facts dt{font-size:var(--text-ui);color:var(--muted)}
.facts dd{font-weight:600;text-align:right}

/* section headings: real <h2>s in sentence case; text after " · " becomes a quiet subtitle.
   Rhythm: 48px between sections, 12px from a heading to its content */
.lbl{font-size:var(--text-subhead);font-weight:700;line-height:1.3;color:var(--ink);margin:var(--space-3xl) 0 var(--space-md)}
.lbl small{display:block;font-size:var(--text-ui);font-weight:400;color:var(--muted);line-height:1.45;margin-top:var(--space-xs)}

/* index rows: name and value share the top line; weight, status and info sit under them */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm val" "meta meta" "spark spark" "info info";column-gap:var(--space-md);padding:var(--space-lg) 0 var(--space-md);border-bottom:1px solid var(--line-soft);align-items:baseline}
.row .nm{grid-area:nm;font-weight:600;line-height:1.3}
.row .val{grid-area:val;font-weight:700;font-size:var(--text-title);line-height:1.2;text-align:right}
.row .meta{grid-area:meta;display:flex;align-items:center;gap:var(--space-sm);margin-top:var(--space-xs)}
.row .tier{font-size:var(--text-caption);font-weight:600;line-height:1.3;padding:0 var(--space-xs);border:1px solid var(--line);color:var(--muted)}
.row .st{font-size:var(--text-ui);color:var(--muted)}
/* 44px target around a small glyph; negative margins keep the line height */
.row .i{margin:-12px -12px -12px auto;width:44px;height:44px;display:grid;place-items:center;line-height:1;color:var(--faint);background:none;border:none;cursor:pointer}
.row.open .i{color:var(--ink)}
.row .sparkwrap{grid-area:spark;display:flex;align-items:center;gap:var(--space-md);margin-top:var(--space-sm)}
.row .spark{flex:1;height:28px;display:block}
.row .sc{font-size:var(--text-ui);font-weight:600;color:var(--faint);min-width:52px;text-align:right}
.row .info{grid-area:info;display:none;font-size:var(--text-ui);color:var(--muted);line-height:1.6;margin-top:var(--space-sm);background:var(--surface);padding:var(--space-md);border:1px solid var(--line-soft)}
.row.open .info{display:block}
.row .info .rd{display:block;margin-top:var(--space-sm);padding-top:var(--space-sm);border-top:1px dashed var(--line-soft);font-size:var(--text-caption);color:var(--faint)}

/* chart tabs wrap instead of scrolling sideways: every chart stays visible */
.tabs{display:flex;flex-wrap:wrap;gap:0 var(--space-xs);border-bottom:1px solid var(--line)}
.tabs button{font-size:var(--text-ui);font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:var(--space-md) var(--space-sm);cursor:pointer;white-space:nowrap;min-height:44px;transition:color .18s,border-color .18s}
.tabs button:hover{color:var(--ink)} .tabs button.on{color:var(--ink);border-bottom-color:var(--btc)}
.chart-box{position:relative;height:230px;margin-top:var(--space-md)}

/* option rows (chart range, backtest horizon, DCA start): one style, left-aligned */
.ranges,.bt-h{display:flex;flex-wrap:wrap;gap:0 var(--space-lg)}
.ranges{margin-top:var(--space-sm)}
.bt-h{margin-bottom:var(--space-sm)}
.ranges button,.bt-h button{font-size:var(--text-ui);font-weight:600;color:var(--faint);background:none;border:none;cursor:pointer;padding:var(--space-sm) var(--space-xs);min-height:44px;border-bottom:1.5px solid transparent;transition:color .18s}
.ranges button:hover,.bt-h button:hover{color:var(--ink)}
.ranges button.on,.bt-h button.on{color:var(--ink);border-bottom-color:var(--ink)}

.bt-head{line-height:1.55;margin-bottom:var(--space-md)}
.bt-head span{color:var(--faint);font-size:var(--text-caption)}
.bt-rows{border-top:1px solid var(--line)}
.bt-row{display:grid;grid-template-columns:1fr auto auto;gap:var(--space-sm) var(--space-md);align-items:baseline;padding:var(--space-md) 0;border-bottom:1px solid var(--line-soft);font-size:var(--text-ui)}
.bt-row.on{margin:0 calc(-1 * var(--space-sm));padding:var(--space-md) var(--space-sm);background:var(--line-soft)}
.bt-row .z{font-weight:600}
.bt-row .m{font-weight:700;font-size:var(--text-body);text-align:right}
.bt-row.thin .m{font-weight:600} /* too few non-overlapping periods: shown, not emphasised */
.bt-row .w{font-size:var(--text-caption);color:var(--muted);text-align:right;min-width:74px}
.bt-note{font-size:var(--text-caption);color:var(--faint);margin-top:var(--space-md);line-height:1.6;max-width:65ch}
details.method{margin-top:var(--space-xs)}
details.method summary{cursor:pointer;font-size:var(--text-ui);color:var(--muted);padding:var(--space-md) 0;width:fit-content}
details.method summary:hover{color:var(--ink)}
details.method .bt-note{margin-top:0}

/* data tables: DCA simulator and similar periods share one grid */
.tbl{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));column-gap:var(--space-md);border-top:1px solid var(--line);font-size:var(--text-ui)}
.tbl>div{padding:var(--space-md) 0;border-bottom:1px solid var(--line-soft)}
.tbl .h{font-size:var(--text-caption);font-weight:600;color:var(--muted)}
.tbl .r{font-weight:600}
.tbl .num{text-align:right;font-weight:600}
.tbl .win{color:var(--z-good)}

/* heatmap */
.hm{display:grid;grid-template-columns:auto repeat(12,1fr);gap:2px;margin-top:var(--space-md)}  /* 2px: cell gutters, not layout spacing */
.hm .y{font-size:var(--text-caption);color:var(--faint);align-self:center;padding-right:var(--space-sm);text-align:right}
.hm .m{height:15px;border-radius:1px;background:var(--line-soft);position:relative}
.hm .mh{font-size:var(--text-caption);color:var(--faint);text-align:center;padding-bottom:var(--space-xs)}
.hm .hv::after{content:"⛏";position:absolute;inset:0;display:grid;place-items:center;font-size:8px}

.foot{margin-top:var(--space-3xl);padding-top:var(--space-lg);border-top:1px solid var(--line);font-size:var(--text-caption);line-height:1.7;color:var(--muted)}
.foot a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);transition:opacity .4s;text-align:center;padding:var(--space-xl)}
.overlay.gone{opacity:0;pointer-events:none}
.overlay p{font-size:var(--text-ui);color:var(--muted);margin:0}
.overlay .err{color:var(--z-bad);max-width:280px}
@media (prefers-reduced-motion: reduce){.gauge .arc,body{transition:none}}
@media (max-width:360px){.score{font-size:3.25rem}.gauge{width:172px;height:172px}.mast h1{font-size:1.125rem}}

/* ---------- desktop: two-column layout ---------- */
@media (min-width:960px){
  .wrap{max-width:1180px;padding-left:var(--space-3xl);padding-right:var(--space-3xl)}
  .cols{display:grid;grid-template-columns:400px minmax(0,1fr);gap:0 var(--space-4xl);align-items:start;margin-top:var(--space-xs)}
  .col-a{position:sticky;top:var(--space-lg);max-height:calc(100dvh - 2 * var(--space-lg));overflow-y:auto;scrollbar-width:none;padding-right:var(--space-xs)}
  .col-a::-webkit-scrollbar{display:none}
  .col-b>.lbl:first-child{margin-top:var(--space-xl)}
  /* index rows: 2-up grid to use width */
  .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--space-3xl)}
  .chart-box{height:340px}
  .hm .m{height:19px}
  .tbl,.bt-rows{max-width:640px}
}
</style>
</head>
<body>
<div class="overlay" id="ov"><p id="ovmsg">…</p></div>

<div class="wrap" id="app" hidden>
  <header class="mast">
    <div><h1>Bitcoin Accumulation</h1><div class="sub" id="m-sub"></div></div>
    <div class="ctrls">
      <button class="cbtn" id="langBtn" title="ภาษา / Language">EN</button>
      <button class="cbtn" id="themeBtn" aria-label="theme"></button>
      <button class="cbtn" id="refresh" aria-label="refresh">↻</button>
    </div>
  </header>

  <main class="cols">
  <div class="col-a">
  <section class="verdict">
    <div class="gauge">
      <svg width="196" height="196" viewBox="0 0 196 196" role="img" aria-label="accumulation score">
        <circle class="track" cx="98" cy="98" r="88"/><circle class="arc" id="arc" cx="98" cy="98" r="88"/>
      </svg>
      <div class="ctr"><div class="score" id="score">0<span class="max">/100</span></div></div>
    </div>
    <div class="zone" id="zone">–</div>
    <div class="zone-th" id="zoneth"></div>
    <div class="tape"><span id="price">$–</span><span class="chg" id="chg"></span></div>
    <div class="asof" id="asof"></div>
  </section>

  <!-- the recommendation, said once; then the few facts it rests on -->
  <dl class="plan">
    <div><dt id="ins-action-l"></dt><dd id="ins-dca"></dd></div>
    <div><dt id="ins-inval-l"></dt><dd id="ins-inval"></dd></div>
  </dl>
  <p class="disc" id="ins-disc"></p>

  <dl class="facts">
    <div><dt id="s-mom-l"></dt><dd id="s-mom">–</dd></div>
    <div id="s-rp-wrap" hidden><dt id="s-rp-l"></dt><dd id="s-rp">–</dd></div>
    <div id="s-nupl-wrap" hidden><dt id="s-nupl-l"></dt><dd id="s-nupl">–</dd></div>
  </dl>
  </div><!-- /col-a -->

  <div class="col-b">
  <h2 class="lbl" id="lbl-index"></h2>
  <div class="rows" id="rows"></div>

  <section>
    <h2 class="lbl" id="lbl-charts"></h2>
    <div class="tabs" id="tabs"></div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="ranges" id="ranges"></div>
  </section>

  <section>
    <h2 class="lbl" id="lbl-bt"></h2>
    <div class="bt-h" id="bth"></div>
    <div class="bt-head" id="bthead"></div>
    <div class="bt-rows" id="bt"></div>
    <details class="method"><summary id="bt-note-s"></summary><div class="bt-note" id="bt-note"></div></details>
  </section>

  <section>
    <h2 class="lbl" id="lbl-dca"></h2>
    <div class="bt-h" id="dcaRange"></div>
    <div class="bt-head" id="dcaHead"></div>
    <div class="tbl" id="dcaGrid"></div>
    <details class="method"><summary id="dca-note-s"></summary><div class="bt-note" id="dca-note"></div></details>
  </section>

  <section>
    <h2 class="lbl" id="lbl-cyc"></h2>
    <div class="tbl" id="cycRows"></div>
    <details class="method"><summary id="cyc-note-s"></summary><div class="bt-note" id="cyc-note"></div></details>
  </section>

  <section>
    <h2 class="lbl" id="lbl-hm"></h2>
    <div class="hm" id="hm"></div>
    <div class="bt-note" id="hm-note"></div>
  </section>
  </div><!-- /col-b -->
  </main><!-- /cols -->

  <footer class="foot" id="foot"></footer>
</div>

<script src="indicators.js?v=5"></script>
<script src="app.js?v=10"></script>
</body>
</html>
