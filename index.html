<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.binance.com https://api.coingecko.com https://raw.githubusercontent.com; base-uri 'self'; object-src 'none'">
<meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<title>Bitcoin Accumulation Signal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23f7931a' stroke='%23171715' stroke-width='5'/%3E%3Ccircle cx='39' cy='46' r='4.5' fill='%23171715'/%3E%3Ccircle cx='61' cy='46' r='4.5' fill='%23171715'/%3E%3Cpath d='M34 60 Q50 76 66 60' stroke='%23171715' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC Accum">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600;700&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#f3f3f0; --surface:#fafaf8; --ink:#171715; --muted:#5f5f5a; --faint:#8a8a83;
  --line:rgba(20,20,16,.14); --line-soft:rgba(20,20,16,.07);
  --btc:#c96b08;
  --z-good:#1c7a47; --z-ok:#5f7d12; --z-neutral:#9a6a00; --z-warn:#bd5a1a; --z-bad:#bb2f24;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --body:'Anuphan','Bricolage Grotesque',sans-serif;
}
.dk{ --bg:#0e0f12; --surface:#16181c; --ink:#e9e7e1; --muted:#9b988f; --faint:#6c6960;
  --line:rgba(255,255,255,.13); --line-soft:rgba(255,255,255,.06); --btc:#f7931a;
  --z-good:#34d399; --z-ok:#a3e635; --z-neutral:#fbbf24; --z-warn:#fb923c; --z-bad:#f87171; }
@media (prefers-color-scheme: dark){ :root:not(.lt){
  --bg:#0e0f12; --surface:#16181c; --ink:#e9e7e1; --muted:#9b988f; --faint:#6c6960;
  --line:rgba(255,255,255,.13); --line-soft:rgba(255,255,255,.06); --btc:#f7931a;
  --z-good:#34d399; --z-ok:#a3e635; --z-neutral:#fbbf24; --z-warn:#fb923c; --z-bad:#f87171; }}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:16px;transition:background .25s,color .25s}
:focus-visible{outline:2.5px solid var(--btc);outline-offset:2px;border-radius:3px}
.wrap{max-width:460px;margin:0 auto;padding:max(env(safe-area-inset-top),16px) 20px calc(env(safe-area-inset-bottom) + 40px)}

.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1.5px solid var(--ink)}
.mast h1{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em;margin:0;line-height:1.05}
.mast .sub{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.ctrls{display:flex;gap:6px;flex:0 0 auto}
.cbtn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);background:none;border:1.5px solid var(--ink);
  padding:0 9px;min-height:44px;min-width:42px;cursor:pointer;display:grid;place-items:center;transition:background .18s,color .18s}
.cbtn:hover,.cbtn:active{background:var(--ink);color:var(--bg)} .cbtn.busy{opacity:.4}
.cbtn svg{width:17px;height:17px;display:block}

.verdict{padding:24px 0 18px;border-bottom:1px solid var(--line);text-align:center}
.gauge{position:relative;width:196px;height:196px;margin:0 auto}
.gauge svg{transform:rotate(-90deg);display:block}
.gauge .track{fill:none;stroke:var(--line-soft);stroke-width:7}
.gauge .arc{fill:none;stroke-width:7;stroke-linecap:butt;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score{font-family:var(--mono);font-weight:700;font-size:62px;line-height:.9;letter-spacing:-.04em}
.score .max{font-size:13px;color:var(--faint);letter-spacing:.05em}
.coin{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:44px;height:44px}
.zone{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin-top:12px;line-height:1.05}
.zone-th{color:var(--muted);font-size:14px;margin-top:2px}
.tape{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.tape .dot{width:7px;height:7px;border-radius:50%;background:var(--z-good);display:inline-block;margin-right:5px}
.tape .chg.up{color:var(--z-good)} .tape .chg.down{color:var(--z-bad)}
.asof{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:9px;letter-spacing:.02em;line-height:1.7}
.asof .stale{color:var(--z-warn);font-weight:600}

.scale{display:flex;gap:3px;margin-top:18px}
.scale .seg{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--faint);padding-top:6px;border-top:3px solid var(--line);transition:.2s}
.scale .seg.on{color:var(--ink);font-weight:700}

.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.layers .cell{border:1px solid var(--line);padding:11px 9px;text-align:center}
.layers .cell .k{font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.layers .cell .v{font-family:var(--display);font-weight:800;font-size:19px;margin-top:5px;line-height:1.1}
.layers .cell .vs{font-family:var(--mono);font-size:9.5px;margin-top:4px;color:var(--muted);line-height:1.3}

.summary{display:grid;gap:9px;margin:20px 0 4px}
.summary div{display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-bottom:1px dashed var(--line-soft);padding-bottom:8px}
.summary span{font-size:13px;color:var(--muted)}
.summary b{font-family:var(--mono);font-weight:700;font-size:14px;text-align:right}
.insight{background:var(--surface);border:1px solid var(--line);padding:15px 16px;margin-top:16px}
.insight p{margin:0 0 12px;font-size:14px;line-height:1.6}
.insight .ins-row{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:12.5px;padding-top:9px;border-top:1px solid var(--line-soft)}
.insight .ins-row span{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding-top:2px;white-space:nowrap}
.insight .ins-row b{font-weight:600}

.lbl{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:26px 0 2px}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"id val" "spark spark" "bar bar" "info info";gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
.row .id{grid-area:id;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row .nm{font-weight:600;font-size:15px}
.row .tier{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 4px;border:1px solid var(--line);color:var(--muted)}
.row .tier.S{border-color:var(--btc);color:var(--btc)}
.row .st{font-size:12px;color:var(--muted)}
.row .i{margin-left:auto;font-size:13px;line-height:1;color:var(--faint);background:none;border:none;cursor:pointer;padding:2px 6px;min-height:30px}
.row.open .i{color:var(--ink)}
.row .val{grid-area:val;font-family:var(--mono);font-weight:700;font-size:23px;letter-spacing:-.03em;text-align:right}
.row .sparkwrap{grid-area:spark;display:flex;align-items:center;gap:10px;margin-top:2px}
.row .spark{flex:1;height:28px;display:block}
.row .sc{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint);min-width:40px;text-align:right}
.row .rbar{grid-area:bar;height:3px;background:var(--line-soft);margin-top:8px}
.row .rbar i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.row .info{grid-area:info;display:none;font-size:12px;color:var(--muted);line-height:1.55;margin-top:9px;background:var(--surface);padding:9px 11px;border:1px solid var(--line-soft)}
.row.open .info{display:block}
.row .info .rd{display:block;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line-soft);font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:12px;cursor:pointer;white-space:nowrap;min-height:44px;transition:color .18s,border-color .18s}
.tabs button:hover{color:var(--ink)} .tabs button.on{color:var(--ink);border-bottom-color:var(--btc)}
.chart-box{position:relative;height:230px;margin-top:14px}
.ranges{display:flex;gap:14px;justify-content:center;margin-top:12px;font-family:var(--mono)}
.ranges button{font-size:11px;font-weight:600;color:var(--faint);background:none;border:none;cursor:pointer;padding:6px 10px;min-height:44px;border-bottom:1.5px solid transparent;transition:color .18s}
.ranges button:hover{color:var(--ink)} .ranges button.on{color:var(--ink);border-bottom-color:var(--ink)}

.bt-h{display:flex;gap:16px;margin:4px 0 14px;font-family:var(--mono)}
.bt-h button{font-size:11px;font-weight:600;color:var(--faint);background:none;border:none;cursor:pointer;padding:8px 2px;min-height:40px;border-bottom:1.5px solid transparent;transition:color .18s}
.bt-h button:hover{color:var(--ink)} .bt-h button.on{color:var(--ink);border-bottom-color:var(--ink)}
.bt-head{font-size:14px;line-height:1.5;margin-bottom:14px}
.bt-head span{color:var(--faint);font-family:var(--mono);font-size:11px}
.bt-rows{border-top:1px solid var(--line)}
.bt-row{display:grid;grid-template-columns:1fr auto auto;gap:10px 14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12px}
.bt-row.on{margin:0 -10px;padding:11px 10px;background:var(--line-soft)}
.bt-row .z{font-weight:700;font-size:11px;letter-spacing:.02em}
.bt-row .m{font-weight:700;font-size:16px;text-align:right}
.bt-row .w{color:var(--muted);text-align:right;min-width:74px}
.bt-note{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:13px;line-height:1.65}

/* DCA simulator */
.dca-grid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:0 10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px}
.dca-grid>div{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.dca-grid .h{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.dca-grid .r{font-weight:600}
.dca-grid .num{text-align:right;font-weight:700}
.dca-grid .win{color:var(--z-good)}

/* cycle compare */
.cyc-rows{border-top:1px solid var(--line)}
.cyc-row{padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13px;font-family:var(--mono);line-height:1.6}

/* heatmap */
.hm{display:grid;grid-template-columns:auto repeat(12,1fr);gap:2px;margin-top:12px;font-family:var(--mono)}
.hm .y{font-size:9px;color:var(--faint);align-self:center;padding-right:5px;text-align:right}
.hm .m{height:15px;border-radius:1px;background:var(--line-soft);position:relative}
.hm .mh{font-size:8px;color:var(--faint);text-align:center;padding-bottom:2px}
.hm .hv::after{content:"⛏";position:absolute;inset:0;display:grid;place-items:center;font-size:8px}

.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;line-height:1.8;color:var(--faint);letter-spacing:.01em}
.foot a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);transition:opacity .4s;text-align:center;padding:24px}
.overlay.gone{opacity:0;pointer-events:none}
.overlay .lc{width:54px;height:54px;animation:flip 1.2s cubic-bezier(.6,.05,.4,.95) infinite}
@keyframes flip{to{transform:rotateY(360deg)}}
.overlay p{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:18px}
.overlay .err{color:var(--z-bad);max-width:280px}
@media (prefers-reduced-motion: reduce){.gauge .arc,.row .rbar i,body{transition:none}.overlay .lc{animation:none}}
@media (max-width:360px){.score{font-size:52px}.gauge{width:172px;height:172px}.mast h1{font-size:15px}}

/* ---------- desktop: two-column layout ---------- */
@media (min-width:960px){
  .wrap{max-width:1180px;padding-left:44px;padding-right:44px}
  .mast h1{font-size:20px}
  .cols{display:grid;grid-template-columns:400px minmax(0,1fr);gap:0 64px;align-items:start;margin-top:4px}
  .col-a{position:sticky;top:18px;max-height:calc(100dvh - 36px);overflow-y:auto;scrollbar-width:none;padding-right:4px}
  .col-a::-webkit-scrollbar{display:none}
  .col-b>.lbl:first-child{margin-top:24px}
  /* index rows: 2-up grid to use width */
  .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:44px}
  .chart-box{height:340px}
  .hm .m{height:19px}
  .hm .y,.hm .mh{font-size:10px}
  .dca-grid,.bt-rows,.cyc-rows{max-width:640px}
  .bt-note{max-width:640px}
  .insight p{font-size:14.5px}
}
</style>
</head>
<body>
<div class="overlay" id="ov"><div>
  <svg class="lc" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/><text x="50" y="67" font-size="48" font-weight="800" text-anchor="middle" fill="currentColor" font-family="JetBrains Mono">B</text></svg>
  <p id="ovmsg">…</p>
</div></div>

<div class="wrap" id="app" hidden>
  <header class="mast">
    <div><h1>BITCOIN ACCUMULATION</h1><div class="sub" id="m-sub"></div></div>
    <div class="ctrls">
      <button class="cbtn" id="langBtn" aria-label="language">EN</button>
      <button class="cbtn" id="themeBtn" aria-label="theme"></button>
      <button class="cbtn" id="refresh" aria-label="refresh">↻</button>
    </div>
  </header>

  <div class="cols">
  <div class="col-a">
  <section class="verdict">
    <div class="gauge">
      <svg class="coin" id="coin" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <svg width="196" height="196" viewBox="0 0 196 196" role="img" aria-label="accumulation score">
        <circle class="track" cx="98" cy="98" r="88"/><circle class="arc" id="arc" cx="98" cy="98" r="88"/>
      </svg>
      <div class="ctr"><div class="score" id="score">0<span class="max">/100</span></div></div>
    </div>
    <div class="zone" id="zone">—</div>
    <div class="zone-th" id="zoneth"></div>
    <div class="tape"><span id="price">$—</span><span class="chg" id="chg"></span></div>
    <div class="asof" id="asof"></div>
    <div class="scale" id="scale"></div>
  </section>

  <div class="layers" id="layers"></div>

  <div class="summary">
    <div><span id="s-price-l"></span><b id="s-price">—</b></div>
    <div><span id="s-val-l"></span><b id="s-val">—</b></div>
    <div><span id="s-mom-l"></span><b id="s-mom">—</b></div>
    <div id="s-rp-wrap" hidden><span id="s-rp-l"></span><b id="s-rp">—</b></div>
    <div id="s-nupl-wrap" hidden><span id="s-nupl-l"></span><b id="s-nupl">—</b></div>
  </div>

  <div class="insight">
    <p id="ins-what"></p>
    <div class="ins-row"><span id="ins-action-l"></span><b id="ins-dca"></b></div>
    <div class="ins-row"><span id="ins-inval-l"></span><b id="ins-inval"></b></div>
  </div>
  </div><!-- /col-a -->

  <div class="col-b">
  <div class="lbl" id="lbl-index"></div>
  <div class="rows" id="rows"></div>

  <section>
    <div class="lbl" id="lbl-charts"></div>
    <div class="tabs" id="tabs"></div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="ranges" id="ranges"></div>
  </section>

  <section>
    <div class="lbl" id="lbl-bt"></div>
    <div class="bt-h" id="bth"></div>
    <div class="bt-head" id="bthead"></div>
    <div class="bt-rows" id="bt"></div>
    <div class="bt-note" id="bt-note"></div>
  </section>

  <section>
    <div class="lbl" id="lbl-dca"></div>
    <div class="bt-h" id="dcaRange"></div>
    <div class="bt-head" id="dcaHead"></div>
    <div class="dca-grid" id="dcaGrid"></div>
    <div class="bt-note" id="dca-note"></div>
  </section>

  <section>
    <div class="lbl" id="lbl-cyc"></div>
    <div class="cyc-rows" id="cycRows"></div>
    <div class="bt-note" id="cyc-note"></div>
  </section>

  <section>
    <div class="lbl" id="lbl-hm"></div>
    <div class="hm" id="hm"></div>
    <div class="bt-note" id="hm-note"></div>
  </section>
  </div><!-- /col-b -->
  </div><!-- /cols -->

  <footer class="foot" id="foot"></footer>
</div>

<script src="indicators.js?v=4"></script>
<script src="app.js?v=1"></script>
</body>
</html>
